name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Harness static checks
        shell: pwsh
        run: ./scripts/Invoke-HarnessCheck.ps1 -SkipAnalyzer -SkipPester

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Analyze
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $issues | Format-Table -AutoSize -Wrap
          if ($issues) { throw "PSScriptAnalyzer reported $(@($issues).Count) issue(s)." }

  test:
    name: Pester (${{ matrix.os }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Pester
        run: Install-Module -Name Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Unit tests
        run: |
          Import-Module -Name Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      # Runs the real entry point on Windows Server 2022/2025 without changing anything:
      # version detection, lifecycle lookup, step applicability and the JSON report.
      - name: Smoke test (-WhatIf)
        run: |
          $logs = Join-Path $env:RUNNER_TEMP 'maintenance-logs'
          ./Invoke-WindowsMaintenance.ps1 -WhatIf -LogDirectory $logs
          if ($LASTEXITCODE -notin 0, 3010) { throw "Unexpected exit code $LASTEXITCODE" }
          $report = Get-ChildItem $logs -Filter '*.json' | Select-Object -First 1 | Get-Content -Raw | ConvertFrom-Json
          $report.os | Format-List
          $report.lifecycle | Format-List
          if (-not $report.os.IsServer) { throw 'Expected Windows Server to be detected on the runner.' }

      # Same command line shape as the scheduled task: powershell.exe -File with a list.
      - name: Smoke test (powershell.exe -File with a step list)
        run: |
          $logs = Join-Path $env:RUNNER_TEMP 'maintenance-logs-file'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./Invoke-WindowsMaintenance.ps1 -WhatIf -Only WinGet,WindowsUpdate -LogDirectory $logs
          if ($LASTEXITCODE -notin 0, 3010) { throw "Unexpected exit code $LASTEXITCODE" }
          $report = Get-ChildItem $logs -Filter '*.json' | Select-Object -First 1 | Get-Content -Raw | ConvertFrom-Json
          $only = @($report.parameters.only)
          "only = $($only -join ', ')"
          if ($only.Count -ne 2 -or $only -notcontains 'WinGet' -or $only -notcontains 'WindowsUpdate') {
            throw 'The step list was not passed through powershell.exe -File correctly.'
          }

      # A second run while another run holds the lock must stop before touching anything.
      # It runs for real (no -WhatIf) on the elevated runner; if the lock did not work,
      # only the read-only DiskHealth step would run and the exit code check would fail.
      - name: Smoke test (second run while another run holds the lock)
        run: |
          $ready = Join-Path $env:RUNNER_TEMP 'lock.ready'
          $release = Join-Path $env:RUNNER_TEMP 'lock.release'
          $logs = Join-Path $env:RUNNER_TEMP 'maintenance-logs-locked'
          $script = (Resolve-Path ./Invoke-WindowsMaintenance.ps1).Path
          $holderCode = ". '$script'; `$lock = Enter-MaintenanceLock; Set-Content -LiteralPath '$ready' -Value `$lock.Status; while (-not (Test-Path -LiteralPath '$release')) { Start-Sleep -Milliseconds 200 }; Exit-MaintenanceLock -Lock `$lock"
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($holderCode))
          $holder = Start-Process -FilePath (Get-Process -Id $PID).Path -ArgumentList '-NoProfile', '-EncodedCommand', $encoded -PassThru -WindowStyle Hidden
          try {
            $deadline = (Get-Date).AddSeconds(60)
            while (-not (Test-Path -LiteralPath $ready) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 200 }
            $holderStatus = Get-Content -LiteralPath $ready -Raw -ErrorAction SilentlyContinue
            "holder: $holderStatus"
            if ("$holderStatus".Trim() -ne 'Acquired') { throw 'The holder process did not acquire the lock.' }

            ./Invoke-WindowsMaintenance.ps1 -Only DiskHealth -LogDirectory $logs
            $code = $LASTEXITCODE
            "second run exit code: $code"
            if ($code -ne 170) { throw "Expected exit code 170 (already running), got $code." }
            if (Test-Path -LiteralPath $logs) { throw 'The blocked run created its log directory; it must stop before touching anything.' }
          }
          finally {
            Set-Content -LiteralPath $release -Value 'release'
            if (-not $holder.WaitForExit(30000)) { $holder.Kill() }
          }
